<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080B16">
<title>Dashboard – Termivox</title>
<link rel="icon" type="image/svg+xml" href="termivox-icon.svg">
<link rel="preload" href="fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-grotesque-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
/* Dashboard für den Betrieb – nutzt die Grundlagen aus styles.css */
.db{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.db-wrap{width:100%;max-width:880px;margin:0 auto;padding:0 20px}

/* Anmeldung */
.gate{flex:1;display:grid;place-items:center;padding:32px 20px}
.gate-card{width:100%;max-width:420px;border-radius:24px;padding:32px 26px}
.gate-card h1{font-size:30px;margin:14px 0 8px}
.gate-card p{color:var(--mut)}
.gate-card form{margin-top:22px}
.dfld{display:block;font-weight:600;font-size:15px;margin:0 0 8px}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:18px;letter-spacing:.04em}
.inp::placeholder{color:var(--mut);letter-spacing:0}
.gate-card .btn{width:100%;margin-top:16px}
.msg{margin-top:14px;color:#FFB4A8;font-size:15px;min-height:1.4em}
.msg.ok{color:var(--mint)}
.msg:empty{margin:0;min-height:0}

/* Kopf */
.bar{position:sticky;top:0;z-index:20;background:rgba(8,11,22,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-top:4px solid var(--accent)}
.bar .db-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.bar h1{font-size:24px;line-height:1.1}
.bar small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.bar-act{display:flex;gap:8px;flex:none}
.icon-btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.icon-btn:hover{border-color:var(--mint)}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0 8px}
.kpi{border-radius:20px;padding:16px 14px;text-align:left;color:var(--tx);font:inherit;cursor:default;min-height:44px}
button.kpi{cursor:pointer}
.kpi b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:40px;line-height:1;letter-spacing:-.03em}
.kpi span{display:block;margin-top:8px;font-size:14px;color:var(--mut);line-height:1.25}
.kpi.warn b{color:var(--mint)}

/* Reiter */
.dtabs{display:flex;gap:8px;margin:20px 0 6px}
.dtab{position:relative;flex:1;min-height:52px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--mut);font:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.dtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cnt{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--mint);color:#04241B;font-size:14px;font-weight:700;display:inline-grid;place-items:center}
.panel{padding-bottom:110px}

/* Listen */
.day{margin:26px 0 10px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
.day small{color:var(--mut);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;font-weight:500;letter-spacing:0;margin-left:8px}
.item{display:flex;gap:16px;align-items:flex-start;border-radius:18px;padding:14px 16px;margin-bottom:10px}
.item.off{opacity:.55}
.zeit{flex:none;min-width:64px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700;line-height:1.1}
.zeit small{display:block;font-family:'Instrument Sans',system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--mut);margin-top:3px}
.info{min-width:0;flex:1}
.info strong{display:block;font-size:18px;overflow-wrap:anywhere}
.info span{color:var(--mut);font-size:15px;overflow-wrap:anywhere}
.tag{display:table;margin-top:8px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);color:var(--tx)}
.tag.open{background:rgba(52,224,184,.16);color:var(--mint)}
.tag.cancel{background:rgba(255,120,100,.16);color:#FFB4A8}
.leer{margin:26px 0;color:var(--mut);text-align:center;padding:30px 16px;border-radius:18px;border:1px dashed var(--line)}

/* Rückrufe */
.seg{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--mut);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--mint);color:var(--tx);background:rgba(52,224,184,.1)}
.rr{border-radius:18px;padding:16px;margin-bottom:12px}
.rr-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rr-top strong{font-size:19px;overflow-wrap:anywhere}
.rr-time{color:var(--mut);font-size:14px;white-space:nowrap}
.rr p{margin:8px 0 0;color:var(--tx);white-space:pre-line;overflow-wrap:anywhere}
.rr-act{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.rr-act .btn{flex:1;min-width:150px}
.rr-tel{margin-top:6px;display:inline-block;font-size:18px;font-weight:600;padding:10px 0}

/* Feste Leiste am Handy */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(8,11,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock .dtab{min-height:54px}
@media (max-width:720px){
  .dtabs{display:none}
  .dock{display:flex}
  .bar h1{font-size:21px}

  .kpis{gap:8px}
  .kpi{padding:14px 10px}
}
@media (max-width:430px){.icon-btn{padding:0 10px;font-size:14px}.bar-act{gap:6px}.bar .db-wrap{gap:8px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="tv db" id="app">

<!-- Anmeldung mit persönlichem Link (?kunde=…) und PIN -->
<section class="gate" id="gate" aria-labelledby="gate-titel">
  <div class="gate-card glass">
    <span class="eyebrow">Termivox</span>
    <h1 id="gate-titel">Ihr Dashboard</h1>
    <p id="gate-text">Bitte geben Sie Ihre PIN ein.</p>
    <form id="login" novalidate>
      <label class="dfld" for="pin">PIN</label>
      <input class="inp" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" required>
      <button class="btn btn-p" type="submit" id="login-btn">Anmelden</button>
      <div class="msg" id="login-msg" role="alert"></div>
    </form>
  </div>
</section>

<!-- Dashboard -->
<div id="board" hidden>
  <header class="bar">
    <div class="db-wrap">
      <div>
        <h1 id="betrieb">Ihr Betrieb</h1>
        <small id="stand">Wird geladen…</small>
      </div>
      <div class="bar-act">
        <button class="icon-btn" type="button" id="reload" aria-label="Aktualisieren">Aktualisieren</button>
        <button class="icon-btn" type="button" id="logout">Abmelden</button>
      </div>
    </div>
  </header>

  <main class="db-wrap" id="inhalt" tabindex="-1">
    <section class="kpis" aria-label="Kennzahlen">
      
      <button class="kpi glass warn" type="button" id="k-rr-btn"><b id="k-rr">–</b><span>Rückrufe offen</span></button>
      <button class="kpi glass" type="button" id="k-ok-btn"><b id="k-ok">–</b><span>Rückrufe erledigt</span></button>
    </section>

    <div class="dtabs" role="tablist" aria-label="Bereiche" id="tabs-top">
      <button class="dtab" role="tab" id="t-rueckrufe" aria-controls="p-rueckrufe" aria-selected="true" type="button">Rückrufe <span class="cnt" id="c-rr" hidden>0</span></button>
      <button class="dtab" role="tab" id="t-termine" aria-controls="p-termine" aria-selected="false" type="button">Termine</button>
    </div>

    <div class="msg" id="board-msg" role="status"></div>

    <section class="panel" id="p-rueckrufe" role="tabpanel" aria-labelledby="t-rueckrufe">
      <div class="seg" role="group" aria-label="Filter">
        <button type="button" data-f="offen" aria-pressed="true">Offen</button>
        <button type="button" data-f="erledigt" aria-pressed="false">Erledigt</button>
        <button type="button" data-f="alle" aria-pressed="false">Alle</button>
      </div>
      <div id="rr-liste"></div>
    </section>
    <section class="panel" id="p-termine" role="tabpanel" aria-labelledby="t-termine" hidden>
      <div class="leer"><strong>Termine folgen bald</strong><br>Sobald die Terminübersicht freigeschaltet ist, sehen Sie Ihre Termine hier.</div>
    </section>
  </main>

  <nav class="dock" role="tablist" aria-label="Bereiche (mobil)" id="tabs-dock">
    <button class="dtab" role="tab" data-t="rueckrufe" aria-selected="true" type="button">Rückrufe <span class="cnt" id="c-rr2" hidden>0</span></button>
    <button class="dtab" role="tab" data-t="termine" aria-selected="false" type="button">Termine</button>
  </nav>
</div>

</div>

<script>
(() => {
  'use strict';

  // ---- Schnittstelle zu n8n ------------------------------------------------
  // Eine Adresse, alles per POST (JSON), kein Token, kein Authorization-Header.
  // Die PIN steht weder im Code noch in der URL oder im Browser-Speicher: Sie liegt nur
  // im Arbeitsspeicher dieser Seite. Nach Neuladen oder Abmelden muss sie neu eingegeben werden.
  const API = 'https://n8n.termivox.com/webhook/dashboard-api';
  const BETRIEB_URL = 'https://n8n.termivox.com/webhook/betrieb';   // GET ?kunde=ID -> { name, telefon, farbe }
  const TZ = 'Europe/Berlin';
  const REFRESH_MS = 60000;

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const kunde = (params.get('kunde') || '').trim();
  const kundeOk = /^[A-Za-z0-9_-]{1,64}$/.test(kunde);

  const state = { pin: '', rueckrufe: [], offen: 0, filter: 'offen', timer: null, busy: false };

  // ---- Hilfen ---------------------------------------------------------------
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const fShort = new Intl.DateTimeFormat('de-DE', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const fTime = new Intl.DateTimeFormat('de-DE', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  const toDate = (v) => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
  const telHref = (t) => {
    const s = String(t || '').trim();
    return /^[+0-9 ()\/-]{5,30}$/.test(s) ? 'tel:' + s.replace(/[^+0-9]/g, '') : null;
  };

  // ---- Netzwerk -------------------------------------------------------------
  class LoginError extends Error {}   // 401: falsche PIN oder gesperrt, Text kommt von n8n

  async function api(body) {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ kunde_id: kunde, pin: state.pin }, body))
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* keine JSON-Antwort */ }
    if (res.status === 401) throw new LoginError((data && data.fehler) || 'Anmeldung nicht möglich.');
    if (!res.ok || !data || data.success !== true || !Array.isArray(data.rueckrufe)) throw new Error('Antwort ' + res.status);
    return data;
  }

  function uebernehmen(d) {
    state.rueckrufe = d.rueckrufe;
    state.offen = Number.isFinite(Number(d.offen)) ? Number(d.offen) : d.rueckrufe.filter((r) => r.status !== 'erledigt').length;
  }

  // ---- Betriebsname und Farbe (öffentliche Betriebs-Abfrage wie im Chat) -----
  function ladeBetrieb() {
    fetch(BETRIEB_URL + '?kunde=' + encodeURIComponent(kunde))
      .then((r) => (r.ok ? r.json() : null))
      .then((b) => {
        if (!b || typeof b !== 'object') return;
        if (typeof b.name === 'string' && b.name.trim()) {
          $('betrieb').textContent = b.name.trim();
          document.title = b.name.trim() + ' – Dashboard – Termivox';
        }
        if (/^#[0-9A-Fa-f]{6}$/.test(b.farbe || '')) $('app').style.setProperty('--accent', b.farbe);
      })
      .catch(() => { /* Standardwerte bleiben */ });
  }

  // ---- Anmeldung / Abmeldung ------------------------------------------------
  function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

  function zeigeGate(text) {
    stopTimer();
    $('board').hidden = true;
    $('gate').hidden = false;
    $('login-msg').textContent = text || '';
    setTimeout(() => $('pin').focus(), 50);
  }

  function abmelden(text) {
    state.pin = ''; state.rueckrufe = []; state.offen = 0;
    $('pin').value = '';
    $('rr-liste').replaceChildren();
    zeigeGate(text);
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    const msg = $('login-msg');
    if (!pin) { msg.textContent = 'Bitte geben Sie Ihre PIN ein.'; $('pin').focus(); return; }
    if (!/^[0-9]+$/.test(pin)) { msg.textContent = 'Die PIN besteht nur aus Ziffern.'; $('pin').focus(); return; }
    $('login-btn').disabled = true; msg.textContent = 'Wird geprüft…';
    state.pin = pin;
    try {
      const d = await api({ aktion: 'liste' });
      uebernehmen(d);
      $('pin').value = ''; msg.textContent = '';
      $('gate').hidden = true; $('board').hidden = false;
      $('stand').textContent = 'Stand ' + fTime.format(new Date()) + ' Uhr';
      render();
      ladeBetrieb();
      stopTimer();
      state.timer = setInterval(() => { if (!document.hidden) lade(true); }, REFRESH_MS);
    } catch (err) {
      state.pin = '';
      msg.textContent = err instanceof LoginError ? err.message : 'Gerade klappt etwas nicht. Bitte versuchen Sie es gleich noch einmal.';
      $('pin').value = ''; $('pin').focus();
    } finally {
      $('login-btn').disabled = false;
    }
  });

  // ---- Daten laden ----------------------------------------------------------
  async function lade(still) {
    if (!state.pin || state.busy) return;
    const msg = $('board-msg');
    if (!still) { msg.textContent = ''; $('stand').textContent = 'Wird geladen…'; }
    try {
      uebernehmen(await api({ aktion: 'liste' }));
      msg.textContent = '';
      $('stand').textContent = 'Stand ' + fTime.format(new Date()) + ' Uhr';
      render();
    } catch (err) {
      if (err instanceof LoginError) { abmelden(err.message); return; }
      msg.textContent = 'Gerade klappt etwas nicht. Die Daten konnten nicht geladen werden. Bitte versuchen Sie es gleich noch einmal.';
      if (!still) $('stand').textContent = 'Nicht aktuell';
    }
  }

  // ---- Darstellung ----------------------------------------------------------
  function render() {
    const erledigt = state.rueckrufe.filter((r) => r.status === 'erledigt').length;
    $('k-rr').textContent = state.offen;
    $('k-ok').textContent = erledigt;
    [$('c-rr'), $('c-rr2')].forEach((c) => { c.textContent = state.offen; c.hidden = state.offen === 0; });
    renderRueckrufe();
  }

  function renderRueckrufe() {
    const box = $('rr-liste');
    box.replaceChildren();
    const f = state.filter;
    // Reihenfolge von n8n: neueste zuerst
    const liste = state.rueckrufe.filter((r) => f === 'alle' || (f === 'offen' ? r.status !== 'erledigt' : r.status === 'erledigt'));
    if (!liste.length) {
      box.appendChild(el('div', 'leer', f === 'erledigt' ? 'Noch keine erledigten Rückrufe.' : f === 'offen' ? 'Keine offenen Rückrufe. Alles erledigt.' : 'Noch keine Rückrufbitten.'));
      return;
    }
    liste.forEach((r) => {
      const erledigt = r.status === 'erledigt';
      const card = el('article', 'rr glass' + (erledigt ? ' off' : ''));
      const top = el('div', 'rr-top');
      top.appendChild(el('strong', null, r.name || 'Ohne Namen'));
      // n8n liefert "TT.MM.JJ, HH:MM" (schon fertig formatiert). ISO-Zeiten würden umgerechnet.
      const raw = r.eingang ? String(r.eingang) : '';
      const d = /^\d{4}-\d{2}-\d{2}/.test(raw) ? toDate(raw) : null;
      if (d) top.appendChild(el('span', 'rr-time', fShort.format(d) + ' Uhr'));
      else if (raw) top.appendChild(el('span', 'rr-time', raw + (/\d{2}:\d{2}$/.test(raw) ? ' Uhr' : '')));
      card.appendChild(top);
      const href = telHref(r.telefon);
      if (r.telefon) {
        if (href) { const a = el('a', 'rr-tel', r.telefon); a.href = href; card.appendChild(a); }
        else card.appendChild(el('div', 'rr-tel', r.telefon));
      }
      if (r.anliegen) card.appendChild(el('p', null, r.anliegen));
      card.appendChild(el('span', 'tag ' + (erledigt ? '' : 'open'), erledigt ? 'Erledigt' : 'Offen'));
      const act = el('div', 'rr-act');
      if (href) { const call = el('a', 'btn btn-p btn-s', 'Anrufen'); call.href = href; act.appendChild(call); }
      const b = el('button', 'btn btn-g btn-s', erledigt ? 'Wieder öffnen' : 'Als erledigt markieren');
      b.type = 'button';
      b.addEventListener('click', () => setzeStatus(r, erledigt ? 'offen' : 'erledigt'));
      act.appendChild(b);
      card.appendChild(act);
      box.appendChild(card);
    });
  }

  async function setzeStatus(r, neu) {
    if (state.busy) return;
    state.busy = true;
    const msg = $('board-msg'); msg.textContent = '';
    const alt = r.status, altOffen = state.offen;
    r.status = neu; state.offen += neu === 'offen' ? 1 : -1; render();      // sofort anzeigen, bei Fehler zurücksetzen
    try {
      uebernehmen(await api({ aktion: 'status', id: String(r.id), status: neu }));
      $('stand').textContent = 'Stand ' + fTime.format(new Date()) + ' Uhr';
      render();
    } catch (err) {
      if (err instanceof LoginError) { state.busy = false; abmelden(err.message); return; }
      r.status = alt; state.offen = altOffen; render();
      msg.textContent = 'Der Status konnte nicht gespeichert werden. Bitte versuchen Sie es noch einmal.';
    } finally {
      state.busy = false;
    }
  }

  // ---- Bedienung ------------------------------------------------------------
  function waehleTab(name) {
    $('p-rueckrufe').hidden = name !== 'rueckrufe';
    $('p-termine').hidden = name !== 'termine';
    $('t-rueckrufe').setAttribute('aria-selected', String(name === 'rueckrufe'));
    $('t-termine').setAttribute('aria-selected', String(name === 'termine'));
    document.querySelectorAll('#tabs-dock .dtab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.t === name)));
    window.scrollTo({ top: 0 });
  }
  $('t-rueckrufe').addEventListener('click', () => waehleTab('rueckrufe'));
  $('t-termine').addEventListener('click', () => waehleTab('termine'));
  document.querySelectorAll('#tabs-dock .dtab').forEach((b) => b.addEventListener('click', () => waehleTab(b.dataset.t)));

  function setzeFilter(f) {
    state.filter = f;
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
    renderRueckrufe();
  }
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => setzeFilter(b.dataset.f)));
  $('k-rr-btn').addEventListener('click', () => { setzeFilter('offen'); waehleTab('rueckrufe'); });
  $('k-ok-btn').addEventListener('click', () => { setzeFilter('erledigt'); waehleTab('rueckrufe'); });

  $('reload').addEventListener('click', () => lade());
  $('logout').addEventListener('click', () => abmelden(''));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state.pin && !$('board').hidden) lade(true); });

  // ---- Start ----------------------------------------------------------------
  if (!kundeOk) {
    $('gate-text').textContent = 'Bitte öffnen Sie das Dashboard über Ihren persönlichen Link, den Sie von Termivox erhalten haben.';
    $('login').hidden = true;
  } else {
    setTimeout(() => $('pin').focus(), 50);
  }
})();
</script>
</body>
</html>
