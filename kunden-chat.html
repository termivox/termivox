<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Chat mit Ihrem Betrieb</title>
<style>
/* Schriften lokal (OFL-Lizenz in fonts/) – keine Aufrufe an fremde Server */
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/instrument-sans-latin-600-normal.woff2) format('woff2')}

:root{
  --accent:#6A58F5; --bg:#080B16; --surf:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --tx:#EEF1FA; --mut:#A3ACC6; --mint:#34E0B8; --hi:#A99DFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--bg); color:var(--tx); color-scheme:dark;
  font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:18px; line-height:1.5;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;}
button,textarea,input{font:inherit; color:inherit;}
:focus-visible{outline:3px solid var(--mint); outline-offset:2px;}

.app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:720px; margin:0 auto; position:relative;}

/* Kopf */
.kopf{padding:20px 20px 16px; border-bottom:1px solid var(--line); border-top:4px solid var(--accent); background:var(--surf);}
.kopf h1{font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:700; font-size:2rem; line-height:1.1; letter-spacing:-.02em; overflow-wrap:anywhere;}
.kopf p{color:var(--mut); font-size:1rem; margin-top:6px;}

/* Nachrichten */
.verlauf{flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth;}
.msg{max-width:88%; padding:12px 16px; border-radius:18px; white-space:pre-line; overflow-wrap:anywhere;}
.msg.bot{background:var(--surf); border:1px solid var(--line); border-bottom-left-radius:6px; align-self:flex-start;}
.msg.user{background:var(--accent); color:#fff; border-bottom-right-radius:6px; align-self:flex-end;}
.msg a{color:var(--hi);}
.msg.user a{color:#fff;}
.tippt{display:flex; gap:6px; align-items:center; padding:16px 18px;}
.tippt span{width:9px; height:9px; border-radius:50%; background:var(--mut); animation:blink 1.2s infinite ease-in-out;}
.tippt span:nth-child(2){animation-delay:.2s;}
.tippt span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25; transform:scale(.8);}40%{opacity:1; transform:scale(1);}}
@media (prefers-reduced-motion:reduce){.tippt span{animation:none; opacity:.7;} .verlauf{scroll-behavior:auto;}}

/* Schnellauswahl */
.schnell{padding:4px 16px 12px; display:flex; flex-wrap:wrap; gap:10px;}
.schnell button{min-height:48px; padding:10px 18px; border-radius:999px; border:1.5px solid var(--accent); background:transparent; color:var(--tx); font-weight:500; font-size:1rem; cursor:pointer;}
.schnell button:hover{background:var(--accent);}

/* Eingabe */
.eingabe{display:flex; gap:10px; padding:10px 16px; border-top:1px solid var(--line); align-items:flex-end;}
.eingabe textarea{flex:1; min-height:48px; max-height:140px; resize:none; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surf); font-size:1.05rem;}
.eingabe textarea::placeholder{color:var(--mut);}
.senden{min-width:48px; min-height:48px; padding:0 18px; border-radius:14px; border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer;}
.senden:disabled{opacity:.5; cursor:default;}

/* Feste Leiste unten */
.leiste{display:flex; gap:10px; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg);}
.leiste > *{flex:1; min-height:52px; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 12px; border-radius:14px; font-weight:600; font-size:1rem; text-decoration:none; cursor:pointer; line-height:1.2;}
.leiste .sprechen{background:var(--surf); border:1.5px solid var(--line); color:var(--tx);}
.leiste .anruf{background:var(--mint); border:1.5px solid var(--mint); color:#06241d;}

/* Formular-Fenster */
.fenster{position:absolute; inset:0; z-index:5; background:rgba(8,11,22,.88); display:flex; align-items:flex-end; justify-content:center;}
.fenster .karte{width:100%; background:#10142a; border:1px solid var(--line); border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:100%; overflow-y:auto;}
.karte h2{font-family:'Bricolage Grotesque',system-ui,sans-serif; font-size:1.4rem; margin-bottom:6px;}
.karte p{color:var(--mut); font-size:1rem; margin-bottom:14px;}
.karte label{display:block; font-weight:600; font-size:1rem; margin:12px 0 6px;}
.karte input,.karte textarea{width:100%; min-height:48px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surf); font-size:1.05rem;}
.karte textarea{min-height:96px; resize:vertical;}
.karte .reihe{display:flex; gap:10px; margin-top:18px;}
.karte .reihe button{flex:1; min-height:52px; border-radius:14px; font-weight:600; font-size:1rem; cursor:pointer; border:1.5px solid var(--line); background:var(--surf);}
.karte .reihe .ok{background:var(--accent); border-color:var(--accent); color:#fff;}
.karte .hinweis{margin:12px 0 0; color:var(--tx);}

/* Link unvollständig */
.fehlerseite{padding:32px 24px; margin:auto; text-align:center; color:var(--mut);}

@media (min-width:768px){
  .app{border-left:1px solid var(--line); border-right:1px solid var(--line);}
  .fenster{align-items:center; padding:24px;}
  .fenster .karte{border-radius:20px; max-width:480px;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="kopf">
    <h1 id="betrieb-name">Ihr Betrieb</h1>
    <p id="betrieb-zeile">Du chattest mit dem KI-Assistenten</p>
  </header>

  <div class="fehlerseite" id="link-fehler" hidden></div>

  <main class="verlauf" id="verlauf" aria-live="polite" aria-label="Chatverlauf"></main>

  <div class="schnell" id="schnell">
    <button type="button" data-text="Ich möchte einen Termin buchen.">Termin buchen</button>
    <button type="button" data-text="Was kosten eure Leistungen?">Preise</button>
    <button type="button" data-text="Wie sind eure Öffnungszeiten?">Öffnungszeiten</button>
    <button type="button" data-text="Ich möchte einen Termin ändern oder absagen.">Termin ändern oder absagen</button>
  </div>

  <form class="eingabe" id="eingabe">
    <textarea id="text" rows="1" placeholder="Ihre Nachricht..." aria-label="Ihre Nachricht" enterkeyhint="send"></textarea>
    <button type="submit" class="senden" id="senden" aria-label="Senden">Senden</button>
  </form>

  <nav class="leiste" aria-label="Kontakt">
    <button type="button" class="sprechen" id="btn-sprechen">Mit dem Betrieb sprechen</button>
    <a class="anruf" id="btn-anruf" href="#" hidden>Anrufen</a>
  </nav>

  <div class="fenster" id="fenster" hidden>
    <div class="karte" role="dialog" aria-modal="true" aria-labelledby="fenster-titel">
      <h2 id="fenster-titel">Mit dem Betrieb sprechen</h2>
      <p id="bald" hidden>Bald verfügbar</p>
      <form id="rueckruf" novalidate>
        <p>Hinterlassen Sie uns Ihre Nummer, wir melden uns bei Ihnen.</p>
        <label for="r-name">Name</label>
        <input id="r-name" name="name" autocomplete="name" maxlength="100" required>
        <label for="r-tel">Telefonnummer</label>
        <input id="r-tel" name="telefon" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" required>
        <label for="r-text">Ihr Anliegen</label>
        <textarea id="r-text" name="anliegen" maxlength="1000" required></textarea>
        <p class="hinweis" id="r-hinweis" role="status" hidden></p>
        <div class="reihe">
          <button type="button" id="r-zu">Schließen</button>
          <button type="submit" class="ok" id="r-senden">Absenden</button>
        </div>
      </form>
      <div class="reihe" id="bald-zu" hidden><button type="button" id="bald-zu-btn">Schließen</button></div>
    </div>
  </div>
</div>

<script>
(function () {
  // ---- Einstellungen -------------------------------------------------------
  // Adressen folgen, sobald die n8n-Teile fertig sind. Solange leer: Platzhalter.
  var RUECKRUF_URL = 'https://n8n.termivox.com/webhook/rueckruf';  // POST: { kunde_id, tarif, name, telefon, anliegen } -> { success: true } oder 400 { success: false, fehler }
  var BETRIEB_URL  = 'https://n8n.termivox.com/webhook/betrieb';   // GET ?kunde=ID -> { name, telefon, farbe } (Felder können leer sein)

  // Standardwerte, bis der Betrieb Daten liefert
  var betrieb = { name: '', telefon: '', farbe: '' };

  var WEBHOOKS = {
    standard: 'https://n8n.termivox.com/webhook/d2679026-1274-47af-9ee2-10f952bc1d3d/chat',
    pro: 'https://n8n.termivox.com/webhook/d3698176-82a4-410a-9ea8-c259164e1cff/chat',
    business: 'https://n8n.termivox.com/webhook/620ec96c-99a7-4055-af2c-12281124cce9/chat'
  };
  var BEGRUESSUNG = 'Hallo! Wie kann ich Ihnen helfen?';

  // ---- Link prüfen ---------------------------------------------------------
  var params = new URLSearchParams(window.location.search);
  var kunde = (params.get('kunde') || '').trim();
  var tarif = (params.get('tarif') || '').trim().toLowerCase();
  var kundeOk = /^[A-Za-z0-9_-]{1,64}$/.test(kunde);
  var webhookUrl = Object.prototype.hasOwnProperty.call(WEBHOOKS, tarif) ? WEBHOOKS[tarif] : null;

  var $ = function (id) { return document.getElementById(id); };
  var verlauf = $('verlauf'), schnell = $('schnell'), eingabe = $('eingabe'), feld = $('text'), sendenBtn = $('senden');

  if (!kundeOk || !webhookUrl) {
    var f = $('link-fehler');
    f.textContent = !kundeOk
      ? 'Dieser Link ist unvollständig: Die Kunden-ID fehlt oder ist ungültig. Bitte nutzen Sie den Link, den Sie von Termivox erhalten haben.'
      : 'Dieser Link ist unvollständig: Der Tarif fehlt oder ist unbekannt (standard, pro oder business).';
    f.hidden = false;
    [verlauf, schnell, eingabe].forEach(function (e) { e.hidden = true; });
    $('btn-sprechen').hidden = true;
    return;
  }

  // ---- Betriebsdaten anzeigen ---------------------------------------------
  function zeigeBetrieb() {
    var name = betrieb.name;
    $('betrieb-name').textContent = name || 'Ihr Betrieb';
    $('betrieb-zeile').textContent = 'Du chattest mit dem KI-Assistenten' + (name ? ' von ' + name : '');
    document.title = name ? 'Chat – ' + name : 'Chat mit dem KI-Assistenten';
    if (/^#[0-9A-Fa-f]{6}$/.test(betrieb.farbe || '')) {
      document.documentElement.style.setProperty('--accent', betrieb.farbe);
    }
    var tel = String(betrieb.telefon || '').trim();
    var anruf = $('btn-anruf');
    if (/^[+0-9 ()\/-]{5,30}$/.test(tel)) {
      anruf.href = 'tel:' + tel.replace(/[^+0-9]/g, '');
      anruf.hidden = false;
    } else {
      anruf.hidden = true;
    }
  }
  zeigeBetrieb();

  if (BETRIEB_URL) {
    fetch(BETRIEB_URL + (BETRIEB_URL.indexOf('?') < 0 ? '?' : '&') + 'kunde=' + encodeURIComponent(kunde))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || typeof d !== 'object') return;
        ['name', 'telefon', 'farbe'].forEach(function (k) { if (typeof d[k] === 'string' && d[k].trim()) betrieb[k] = d[k].trim(); });
        zeigeBetrieb();
      })
      .catch(function () { /* still: Standardwerte bleiben */ });
  }

  // ---- Nachrichten ----------------------------------------------------------
  function scrollEnde() { verlauf.scrollTop = verlauf.scrollHeight; }

  // Nur Text, **fett** und https-Links; alles andere bleibt reiner Text
  function fuelle(el, text) {
    var teile = String(text).split(/(\*\*[^*]+\*\*|https?:\/\/[^\s<>"')]+)/g);
    teile.forEach(function (t) {
      if (!t) return;
      if (/^\*\*[^*]+\*\*$/.test(t)) {
        var b = document.createElement('strong'); b.textContent = t.slice(2, -2); el.appendChild(b);
      } else if (/^https?:\/\//.test(t)) {
        var a = document.createElement('a'); a.href = t; a.textContent = t; a.target = '_blank'; a.rel = 'noopener noreferrer'; el.appendChild(a);
      } else {
        el.appendChild(document.createTextNode(t));
      }
    });
  }

  function addMsg(wer, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + wer;
    fuelle(d, text);
    verlauf.appendChild(d);
    scrollEnde();
    return d;
  }

  var tippt = null;
  function zeigeTippt(an) {
    if (an && !tippt) {
      tippt = document.createElement('div');
      tippt.className = 'msg bot tippt';
      tippt.setAttribute('aria-label', 'Schreibt gerade');
      tippt.innerHTML = '<span></span><span></span><span></span>';
      verlauf.appendChild(tippt);
      scrollEnde();
    } else if (!an && tippt) {
      tippt.remove(); tippt = null;
    }
  }

  function fehlerText() {
    return betrieb.telefon && !$('btn-anruf').hidden
      ? 'Gerade klappt etwas nicht. Rufen Sie uns bitte an oder nutzen Sie „Mit dem Betrieb sprechen“.'
      : 'Gerade klappt etwas nicht. Bitte nutzen Sie „Mit dem Betrieb sprechen“, wir melden uns bei Ihnen.';
  }

  // ---- Gespräch mit n8n (gleiches Format wie @n8n/chat) ---------------------
  var sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
      });
  var wartet = false;

  // n8n antwortet je nach Einstellung mit {"output":"..."} oder zeilenweise mit Textstücken
  function antwortText(roh) {
    var s = roh.trim();
    if (!s) return '';
    try {
      var j = JSON.parse(s);
      if (j && typeof j === 'object') {
        if (Array.isArray(j)) j = j[0] || {};
        var v = j.output != null ? j.output : (j.text != null ? j.text : (j.message != null ? j.message : null));
        if (v != null) return String(v);
      }
      if (typeof j === 'string') return j;
    } catch (e) { /* evtl. mehrere JSON-Zeilen */ }
    var out = '';
    s.split('\n').forEach(function (zeile) {
      try {
        var o = JSON.parse(zeile);
        if (o && o.type === 'item' && typeof o.content === 'string') out += o.content;
      } catch (e) { /* ignorieren */ }
    });
    return out;
  }

  // Manche Workflows antworten nicht direkt, sondern melden "executionStarted" und
  // schicken die Antwort danach über eine Websocket-Verbindung zu n8n (wie @n8n/chat).
  // Nach der Antwort wird die Verbindung geschlossen; jede neue Frage geht wieder per POST.
  var wartend = null;

  function wsText(daten) {
    try {
      var o = JSON.parse(daten);
      if (o && typeof o === 'object') {
        if (typeof o.text === 'string') return o.text;
        if (typeof o.message === 'string') return o.message;
      }
    } catch (e) { /* kein JSON: reiner Text */ }
    return daten;
  }

  function wsWarten() {
    return new Promise(function (ok, fehl) {
      var timer = setTimeout(function () { wartend = null; fehl(new Error('Zeitüberschreitung')); }, 90000);
      wartend = {
        ok: function (t) { clearTimeout(timer); wartend = null; ok(t); },
        fehl: function (e) { clearTimeout(timer); wartend = null; fehl(e); }
      };
    });
  }

  function oeffneWs(executionId, token) {
    var basis = new URL(webhookUrl).origin.replace(/^http/, 'ws');
    var url = basis + '/chat?sessionId=' + encodeURIComponent(sessionId) + '&executionId=' + encodeURIComponent(executionId) +
      '&isPublic=true' + (token ? '&token=' + encodeURIComponent(token) : '');
    var antwort = wsWarten();
    var s = new WebSocket(url);
    var textProtokoll;  // true: "n8n|..."-Nachrichten, false: JSON-Nachrichten
    s.onmessage = function (e) {
      var d = e.data;
      var textArt = d === 'n8n|heartbeat' || d === 'n8n|continue';
      var typ;
      if (textArt) typ = d === 'n8n|heartbeat' ? 'heartbeat' : 'continue';
      else { try { typ = JSON.parse(d).type; } catch (x) { typ = undefined; } }
      var gueltig = textArt ? textProtokoll !== true : textProtokoll !== false;
      if (typ === 'heartbeat' && gueltig) {
        textProtokoll = !textArt;
        s.send(textArt ? 'n8n|heartbeat-ack' : JSON.stringify({ type: 'heartbeat-ack' }));
        return;
      }
      if (typ === 'continue' && gueltig) return;
      if (wartend) wartend.ok(wsText(d));
      s.close();
    };
    s.onclose = function () {
      if (wartend) wartend.fehl(new Error('Verbindung beendet'));
    };
    s.onerror = function () { /* onclose folgt */ };
    return antwort;
  }

  function holeAntwort(text) {
    return fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'sendMessage',
        sessionId: sessionId,
        chatInput: text,
        metadata: { kunde_id: kunde, salon_id: kunde, tarif: tarif }
      })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (roh) {
        var j = null;
        try { j = JSON.parse(roh); } catch (e) { /* kein JSON */ }
        if (j && j.executionStarted && j.executionId) return oeffneWs(j.executionId, j.resumeToken);
        return antwortText(roh);
      });
  }

  function sende(text) {
    text = String(text || '').trim();
    if (!text || wartet) return;
    wartet = true; sendenBtn.disabled = true;
    schnell.hidden = true;
    addMsg('user', text);
    feld.value = ''; feld.style.height = '';
    zeigeTippt(true);

    holeAntwort(text)
      .then(function (antwort) {
        if (!antwort) throw new Error('leere Antwort');
        zeigeTippt(false);
        addMsg('bot', antwort);
      })
      .catch(function () {
        zeigeTippt(false);
        addMsg('bot', fehlerText());
      })
      .then(function () {
        wartet = false; sendenBtn.disabled = false;
        if ($('fenster').hidden) feld.focus();
      });
  }

  addMsg('bot', BEGRUESSUNG);

  eingabe.addEventListener('submit', function (e) { e.preventDefault(); sende(feld.value); });
  feld.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sende(feld.value); }
  });
  feld.addEventListener('input', function () {
    feld.style.height = 'auto';
    feld.style.height = Math.min(feld.scrollHeight, 140) + 'px';
  });
  schnell.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-text]');
    if (b) sende(b.getAttribute('data-text'));
  });

  // ---- Mit dem Betrieb sprechen --------------------------------------------
  var fenster = $('fenster'), formular = $('rueckruf'), hinweis = $('r-hinweis');
  var BALD = !RUECKRUF_URL;

  function oeffne() {
    $('bald').hidden = !BALD; $('bald-zu').hidden = !BALD; formular.hidden = BALD;
    hinweis.hidden = true;
    fenster.hidden = false;
    (BALD ? $('bald-zu-btn') : $('r-name')).focus();
  }
  function schliesse() { fenster.hidden = true; $('btn-sprechen').focus(); }

  $('btn-sprechen').addEventListener('click', oeffne);
  $('r-zu').addEventListener('click', schliesse);
  $('bald-zu-btn').addEventListener('click', schliesse);
  fenster.addEventListener('click', function (e) { if (e.target === fenster) schliesse(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !fenster.hidden) schliesse(); });

  formular.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('r-name').value.trim(), tel = $('r-tel').value.trim(), anl = $('r-text').value.trim();
    hinweis.hidden = false;
    if (!name || !tel || !anl) { hinweis.textContent = 'Bitte füllen Sie alle drei Felder aus.'; return; }
    $('r-senden').disabled = true;
    hinweis.textContent = 'Wird gesendet...';
    fetch(RUECKRUF_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kunde_id: kunde, tarif: tarif, name: name, telefon: tel, anliegen: anl })
    })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (d) {
          if (r.ok && d && d.success === true) return;
          var e = new Error('Rückruf abgelehnt');
          // 400 = ungültige Angaben: den Hinweis von n8n anzeigen
          if (r.status === 400 && d && typeof d.fehler === 'string' && d.fehler.trim()) e.fehler = d.fehler.trim();
          throw e;
        });
      })
      .then(function () {
        hinweis.textContent = 'Danke! Wir melden uns so bald wie möglich bei Ihnen.';
        formular.reset();
      })
      .catch(function (e) {
        hinweis.textContent = e && e.fehler ? e.fehler
          : 'Das hat leider nicht geklappt. Bitte versuchen Sie es in einem Moment noch einmal.';
      })
      .then(function () { $('r-senden').disabled = false; });
  });
