<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termivox Kunden-Chat</title>
<link rel="icon" type="image/svg+xml" href="termivox-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet">
<style>
:root{
  --ink:#12100D; --ink-2:#191611; --ink-3:#211D17;
  --paper:#EDE7DC; --paper-dim:#948C7C;
  --brass:#C9A15D; --brass-light:#DAB471; --brass-dim:#8A7345; --teal:#4FD1C1;
  --line:rgba(237,231,220,0.12); --line-strong:rgba(237,231,220,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--ink); color:var(--paper); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
h1,h2{font-family:'Fraunces',Georgia,serif; font-weight:600;}
a{color:var(--brass-light);}
header{border-bottom:1px solid var(--line); padding:18px 32px; display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; z-index:10; background:rgba(18,16,13,0.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.logo{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:1.2rem; text-decoration:none; color:var(--paper);}
.back{font-family:'Space Grotesk',sans-serif; font-size:0.82rem; font-weight:600; color:var(--brass-light); text-decoration:none; display:flex; align-items:center; gap:6px;}
.back:hover{color:var(--paper);}
main{max-width:640px; margin:0 auto; padding:48px 24px 80px;}
.eyebrow{font-family:'Space Grotesk',sans-serif; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass-light); margin-bottom:12px;}
h1{font-size:1.9rem; margin-bottom:14px;}
main > p.intro{color:var(--paper); font-size:1.05rem; margin-bottom:32px; max-width:520px;}
.chat-card{background:var(--ink-3); border:1px solid var(--line); border-radius:8px; overflow:hidden; height:520px; position:relative;}
.chat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;z-index:2;
  background:repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 12px);}
#n8n-chat{width:100%; height:100%;}
.chat-error{position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; padding:32px; text-align:center; color:var(--paper-dim); font-size:0.95rem; background:var(--ink-3);}
.chat-error[hidden]{display:none;}
.n8n-message--bot{white-space: pre-wrap;}

@media (max-width:640px){
  main{padding:32px 16px 56px;}
  h1{font-size:1.5rem;}
  .chat-card{height:min(480px, 65vh);}
  header{padding:14px 16px;}
  .logo{font-size:1.05rem;}
}

/* n8n chat widget theming — durchgehend Schwarz/Gold */
:root{
  --chat--color-primary: #C9A15D;
  --chat--color-secondary: #4FD1C1;
  --chat--color-white: #EDE7DC;
  --chat--color-dark: #12100D;
  --chat--body--background: #12100D;
  --chat--message--bot--background: #211D17;
  --chat--message--bot--color: #EDE7DC;
  --chat--message--user--background: #4FD1C1;
  --chat--message--user--color: #12100D;
  --chat--message--pre--background: rgba(0, 0, 0, 0.35);
  --chat--toggle--background: #C9A15D;
  --chat--toggle--color: #12100D;
  --chat--toggle--hover--background: #DAB471;
  --chat--header--background: #191611;
  --chat--header--color: #EDE7DC;
  --chat--textarea--height: 50px;
}
</style>
</head>
<body>
<header>
  <a href="index.html" class="back">← Zur Startseite</a>
  <a href="index.html" class="logo">
    <svg width="22" height="22" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="4" fill="none" stroke="#C9A15D" stroke-width="1.6"/><path d="M9 16l5 5 9-10" fill="none" stroke="#C9A15D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Termivox
  </a>
</header>
<main>
  <div class="eyebrow" id="eyebrow">Kunden-Chat</div>
  <h1>Ihr Termivox Assistent</h1>
  <p class="intro">Schreiben Sie Ihre Nachricht, z. B. "Ich möchte einen Termin buchen" oder "Wie sind eure Öffnungszeiten?".</p>

  <div class="chat-card">
    <div id="n8n-chat"></div>
    <div id="chat-error" class="chat-error" hidden></div>
  </div>
</main>

<script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  const WEBHOOKS = {
    standard: 'https://n8n.termivox.com/webhook/d2679026-1274-47af-9ee2-10f952bc1d3d/chat',
    pro: 'https://n8n.termivox.com/webhook/d3698176-82a4-410a-9ea8-c259164e1cff/chat',
    business: 'https://n8n.termivox.com/webhook/620ec96c-99a7-4055-af2c-12281124cce9/chat',
  };
  const LABELS = { standard: 'Standard', pro: 'Pro', business: 'Business' };

  const params = new URLSearchParams(window.location.search);
  const kunde = (params.get('kunde') || '').trim();
  const tarif = (params.get('tarif') || '').trim().toLowerCase();
  const kundeOk = /^[A-Za-z0-9_-]{1,64}$/.test(kunde);
  const webhookUrl = Object.prototype.hasOwnProperty.call(WEBHOOKS, tarif) ? WEBHOOKS[tarif] : null;

  if (!kundeOk || !webhookUrl) {
    const el = document.getElementById('chat-error');
    el.textContent = !kundeOk
      ? 'Dieser Link ist unvollständig: Die Kunden-ID fehlt oder ist ungültig. Bitte nutzen Sie den Link, den Sie von Termivox erhalten haben.'
      : 'Dieser Link ist unvollständig: Der Tarif fehlt oder ist unbekannt (standard, pro oder business).';
    el.hidden = false;
  } else {
    document.getElementById('eyebrow').textContent = 'Kunden-Chat · ' + LABELS[tarif];
    createChat({
      webhookUrl,
      target: '#n8n-chat',
      mode: 'fullscreen',
      showWelcomeScreen: false,
      metadata: { kunde_id: kunde, salon_id: kunde, tarif },
      initialMessages: ['Hallo! Wie kann ich Ihnen helfen?'],
      i18n: {
        en: {
          title: 'Termivox Assistent',
          subtitle: 'Ihr KI-Terminassistent',
          footer: '',
          getStarted: 'Neue Unterhaltung starten',
          inputPlaceholder: 'Ihre Nachricht...',
        },
      },
    });
  }
</script>
</body>
</html>
