<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10;
    --bg-deep: #05060a;
    --panel: rgba(16, 20, 28, 0.72);
    --line: rgba(255, 138, 60, 0.28);
    --line-strong: rgba(255, 138, 60, 0.6);
    --ember: #ff5b1f;
    --amber: #ffb15c;
    --steel: #93a4b8;
    --text: #e9eef4;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 50% 42%, rgba(255, 91, 31, 0.10), transparent 55%),
      linear-gradient(rgba(147, 164, 184, 0.045) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(147, 164, 184, 0.045) 1px, transparent 1px) 0 0 / 48px 48px,
      radial-gradient(ellipse at center, var(--bg) 40%, var(--bg-deep) 100%);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: max(18px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom));
    gap: 10px;
  }

  /* Kopfzeile */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 1.15rem; letter-spacing: 0.04em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--steel); box-shadow: 0 0 0 0 rgba(255,138,60,0); transition: background .25s, box-shadow .25s; }
  .dot.on { background: var(--amber); box-shadow: 0 0 12px 2px rgba(255,177,92,.55); }
  .dot.err { background: var(--danger); box-shadow: 0 0 12px 2px rgba(255,107,107,.5); }
  .clock { text-align: right; line-height: 1.15; }
  .clock .time { font-size: 1.9rem; font-weight: 300; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .clock .date { font-size: 0.85rem; color: var(--steel); }

  /* Mitte */
  main { display: grid; grid-template-rows: 1fr auto; place-items: center; min-height: 0; gap: 8px; }
  .orb-wrap { display: grid; place-items: center; min-height: 0; width: 100%; }
  canvas { display: block; }
  .status { text-align: center; min-height: 3.4rem; }
  .status .state { font-size: 1.05rem; font-weight: 500; color: var(--amber); letter-spacing: 0.03em; }
  .status .heard { font-size: 0.95rem; color: var(--steel); margin-top: 4px; max-width: 70ch; min-height: 1.3em; }

  /* Unten */
  footer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; justify-items: center; }
  .log {
    width: min(760px, 100%);
    max-height: 22vh;
    overflow-y: auto;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    position: relative;
    font-size: 0.98rem;
    line-height: 1.5;
  }
  .log::before, .log::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--line-strong); pointer-events: none; }
  .log::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .log::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .log p { margin: 0 0 8px; }
  .log p:last-child { margin-bottom: 0; }
  .log .who { color: var(--steel); margin-right: 8px; }
  .log .jarvis .who { color: var(--amber); }
  .log:empty { display: none; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: min(760px, 100%); }
  .controls form { display: flex; flex: 1 1 280px; gap: 8px; }
  input[type="text"], input[type="password"] {
    flex: 1; min-width: 0; font: inherit; color: var(--text);
    background: rgba(8, 10, 15, 0.85); border: 1px solid var(--line); padding: 10px 12px;
  }
  ::placeholder { color: rgba(147, 164, 184, 0.7); }
  button {
    font: inherit; font-weight: 500; color: var(--text); cursor: pointer;
    background: rgba(255, 91, 31, 0.12); border: 1px solid var(--line-strong);
    padding: 10px 16px; transition: background .2s, border-color .2s;
  }
  button:hover { background: rgba(255, 91, 31, 0.24); }
  button.primary { background: var(--ember); border-color: var(--ember); color: #1a0a03; }
  button.primary:hover { background: #ff7440; }
  button[disabled] { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* Startkarte */
  .gate {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 22px;
    background: rgba(5, 6, 10, 0.88); backdrop-filter: blur(6px); z-index: 10;
  }
  .gate.hidden { display: none; }
  .card {
    width: min(420px, 100%); padding: 26px 24px; background: var(--panel);
    border: 1px solid var(--line-strong); position: relative;
  }
  .card h1 { margin: 0 0 6px; font-size: 1.7rem; font-weight: 500; letter-spacing: 0.04em; }
  .card p { margin: 0 0 16px; color: var(--steel); line-height: 1.5; font-size: 0.95rem; }
  .card label { display: block; font-size: 0.9rem; margin-bottom: 6px; }
  .card .row { display: flex; flex-direction: column; gap: 12px; }
  .card .note { margin: 14px 0 0; font-size: 0.85rem; }
  .err-text { color: var(--danger); min-height: 1.2em; font-size: 0.9rem; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--steel); text-decoration: underline; font-size: 0.85rem; cursor: pointer; }

  @media (max-width: 560px) {
    .clock .time { font-size: 1.4rem; }
    .log { max-height: 26vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot" id="dot"></span><span>Jarvis</span></div>
    <div class="clock" aria-hidden="true"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
  </header>

  <main>
    <div class="orb-wrap"><canvas id="orb" role="img" aria-label="Jarvis Kern, zeigt an, ob Jarvis zuhört, nachdenkt oder spricht"></canvas></div>
    <div class="status" aria-live="polite">
      <div class="state" id="state">Nicht gestartet</div>
      <div class="heard" id="heard"></div>
    </div>
  </main>

  <footer>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="controls">
      <button id="talk" disabled>Sprechen</button>
      <form id="textForm" autocomplete="off">
        <input type="text" id="textIn" placeholder="Oder hier tippen" aria-label="Nachricht an Jarvis" disabled>
        <button type="submit" id="send" disabled>Senden</button>
      </form>
      <button id="stop" disabled>Stopp</button>
    </div>
  </footer>
</div>

<div class="gate" id="gate">
  <div class="card">
    <h1>Jarvis</h1>
    <p>Gib deinen Zugangscode ein und starte. Edge fragt danach nach dem Mikrofon, bitte erlauben.</p>
    <div class="row">
      <div>
        <label for="key">Zugangscode</label>
        <input type="password" id="key" autocomplete="off" spellcheck="false">
      </div>
      <div class="err-text" id="gateErr" role="alert"></div>
      <button class="primary" id="start">Jarvis starten</button>
    </div>
    <p class="note">Sag danach „Jarvis“ und deine Frage, oder halte den Knopf „Sprechen“ gedrückt, wenn das Weckwort nicht klappt. Der Code bleibt nur auf diesem Rechner.</p>
    <button class="linkbtn" id="forget" type="button">Gespeicherten Code löschen</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const ENDPOINT = 'https://n8n.termivox.com/webhook/jarvis-web-ask';
  const WAKE = /\b(jarvis|jarwis|jaarvis|dscharvis|tscharvis|scharvis|charvis|jarvies)\b[\s,.:;!?-]*/i;

  const $ = (id) => document.getElementById(id);
  const el = { dot: $('dot'), state: $('state'), heard: $('heard'), log: $('log'), gate: $('gate'), key: $('key'),
    gateErr: $('gateErr'), start: $('start'), forget: $('forget'), talk: $('talk'), textIn: $('textIn'),
    send: $('send'), stop: $('stop'), textForm: $('textForm'), time: $('time'), date: $('date'), canvas: $('orb') };
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Uhr */
  function tick() {
    const d = new Date();
    el.time.textContent = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    el.date.textContent = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick(); setInterval(tick, 15000);

  /* Zustand */
  let state = 'off';            // off | idle | listening | thinking | speaking
  let running = false, busy = false, pushed = false, awaitingUntil = 0;
  let rec = null, recActive = false;
  const LABEL = {
    off: 'Nicht gestartet',
    idle: 'Bereit. Sag „Jarvis“ und deine Frage.',
    listening: 'Ich höre zu',
    thinking: 'Ich denke nach',
    speaking: 'Ich spreche'
  };
  function setState(s, extra) {
    state = s;
    el.state.textContent = extra || LABEL[s];
    el.dot.className = 'dot' + (s === 'off' ? '' : ' on');
  }
  function setError(msg) { el.state.textContent = msg; el.dot.className = 'dot err'; }
  function showHeard(t) { el.heard.textContent = t ? '„' + t + '“' : ''; }
  function addLog(who, text) {
    const p = document.createElement('p'); p.className = who === 'Jarvis' ? 'jarvis' : 'du';
    const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
    p.append(w, document.createTextNode(text));
    el.log.appendChild(p);
    while (el.log.children.length > 8) el.log.removeChild(el.log.firstChild);
    el.log.scrollTop = el.log.scrollHeight;
  }

  /* Audio: Pegel für den Kern */
  let audioCtx = null, micAnalyser = null, playAnalyser = null, level = 0;
  const player = new Audio();
  player.preload = 'auto';
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    playAnalyser = audioCtx.createAnalyser(); playAnalyser.fftSize = 256;
    const src = audioCtx.createMediaElementSource(player);
    src.connect(playAnalyser); playAnalyser.connect(audioCtx.destination);
  }
  async function initMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      micAnalyser = audioCtx.createAnalyser(); micAnalyser.fftSize = 256;
      audioCtx.createMediaStreamSource(stream).connect(micAnalyser);
    } catch (e) { micAnalyser = null; }
  }
  const buf = new Uint8Array(128);
  function readLevel() {
    const a = state === 'speaking' ? playAnalyser : (state === 'idle' || state === 'listening') ? micAnalyser : null;
    let v = 0;
    if (a) { a.getByteFrequencyData(buf); let s = 0; for (let i = 0; i < 64; i++) s += buf[i]; v = Math.min(1, (s / 64) / 140); }
    level += (v - level) * 0.18;
    return level;
  }

  /* Kern zeichnen */
  const ctx = el.canvas.getContext('2d');
  let size = 360, t0 = performance.now();
  function resize() {
    const s = Math.max(220, Math.min(window.innerWidth * 0.86, window.innerHeight * 0.5, 560));
    const dpr = window.devicePixelRatio || 1;
    el.canvas.style.width = el.canvas.style.height = s + 'px';
    el.canvas.width = el.canvas.height = Math.round(s * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = s;
  }
  window.addEventListener('resize', resize); resize();

  function ring(cx, cy, r, width, dash, angle, alpha) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
    ctx.setLineDash(dash); ctx.lineWidth = width;
    ctx.strokeStyle = `rgba(255, 150, 80, ${alpha})`;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  function draw(now) {
    const t = (now - t0) / 1000;
    const lv = readLevel();
    const cx = size / 2, cy = size / 2;
    const speed = reduceMotion ? 0.15 : ({ off: 0.1, idle: 0.25, listening: 0.5, thinking: 1.6, speaking: 0.7 }[state] || 0.25);
    const energy = { off: 0.25, idle: 0.55, listening: 0.8, thinking: 0.75, speaking: 0.9 }[state] || 0.5;
    ctx.clearRect(0, 0, size, size);

    // Außenleuchten
    const glowR = size * (0.34 + lv * 0.10 + (state === 'thinking' && !reduceMotion ? Math.sin(t * 5) * 0.015 : 0));
    const g = ctx.createRadialGradient(cx, cy, size * 0.02, cx, cy, glowR);
    g.addColorStop(0, `rgba(255, 210, 150, ${0.95 * energy})`);
    g.addColorStop(0.28, `rgba(255, 106, 40, ${0.75 * energy})`);
    g.addColorStop(1, 'rgba(255, 91, 31, 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, Math.PI * 2); ctx.fill();

    // Kern
    const coreR = size * (0.095 + lv * 0.05);
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    cg.addColorStop(0, 'rgba(255, 244, 225, 1)'); cg.addColorStop(0.55, 'rgba(255, 170, 90, 1)'); cg.addColorStop(1, 'rgba(255, 91, 31, 0.9)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI * 2); ctx.fill();

    // Ringe
    ring(cx, cy, size * 0.215, 2, [3, 9], t * speed, 0.55 * energy + 0.2);
    ring(cx, cy, size * 0.275, 1.5, [22, 8, 3, 8], -t * speed * 0.8, 0.5 * energy + 0.15);
    ring(cx, cy, size * 0.335 + lv * size * 0.012, 3, [60, 14], t * speed * 0.6, 0.65 * energy + 0.1);
    ring(cx, cy, size * 0.40, 1, [2, 6], -t * speed * 0.35, 0.35);

    // Skala am äußeren Rand
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * speed * 0.12);
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2, long = i % 6 === 0;
      const r1 = size * 0.44, r2 = r1 + (long ? size * 0.028 : size * 0.014);
      ctx.strokeStyle = `rgba(147, 164, 184, ${long ? 0.7 : 0.35})`; ctx.lineWidth = long ? 1.5 : 1; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); ctx.stroke();
    }
    ctx.restore();

    // Pegel-Balken beim Sprechen und Zuhören
    if (state === 'speaking' || state === 'listening') {
      const n = 48;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + t * 0.2;
        const wob = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(t * 6 + i * 1.7);
        const len = size * (0.012 + lv * 0.05 * wob);
        const r1 = size * 0.355;
        ctx.strokeStyle = 'rgba(255, 190, 120, 0.85)'; ctx.lineWidth = 2; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * (r1 + len), cy + Math.sin(a) * (r1 + len)); ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* Spracherkennung */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function startRec() {
    if (!running || busy || !rec || recActive) return;
    try { rec.start(); recActive = true; } catch (e) { /* läuft schon */ }
  }
  function stopRec() { if (rec && recActive) { try { rec.abort(); } catch (e) {} recActive = false; } }

  function setupRec() {
    if (!SR) { setError('Dieser Browser kann keine Spracherkennung. Bitte Edge oder Chrome nutzen.'); return false; }
    rec = new SR();
    rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => { recActive = true; if (!busy && !el.dot.classList.contains('err')) setState(Date.now() < awaitingUntil || pushed ? 'listening' : 'idle'); };
    rec.onend = () => { recActive = false; if (running && !busy) setTimeout(startRec, 250); };
    rec.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { running = false; setError('Mikrofon blockiert. In Edge das Schloss-Symbol neben der Adresse öffnen und das Mikrofon erlauben.'); return; }
      if (e.error === 'network') { setError('Spracherkennung offline. Prüfe die Internetverbindung.'); return; }
      setError('Spracherkennung: ' + e.error);
    };
    rec.onresult = (e) => {
      let interim = '', fin = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
      }
      if (interim) showHeard(interim.trim());
      if (fin) handleFinal(fin.trim());
    };
    return true;
  }

  function handleFinal(text) {
    showHeard(text);
    if (busy || !text) return;
    const m = text.match(WAKE);
    if (m) {
      const cmd = text.slice(m.index + m[0].length).trim();
      if (cmd.length > 1) { ask(cmd); }
      else { awaitingUntil = Date.now() + 9000; pushed = false; setState('listening'); }
      return;
    }
    if (pushed || Date.now() < awaitingUntil) { pushed = false; awaitingUntil = 0; ask(text); }
  }

  /* Anfrage an n8n */
  async function ask(text) {
    if (busy) return;
    busy = true; stopRec();
    addLog('Du', text); setState('thinking');
    const key = localStorage.getItem('jarvis_key') || '';
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 90000);
    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'X-Jarvis-Key': key },
        body: JSON.stringify({ text })
      });
      if (res.status === 401 || res.status === 403) { localStorage.removeItem('jarvis_key'); throw new Error('code'); }
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const answer = (data.text || '').trim() || 'Ich habe keine Antwort bekommen.';
      addLog('Jarvis', answer);
      await speak(answer, data.audio);
    } catch (err) {
      let msg = 'Das hat nicht geklappt. Prüfe die Verbindung zu n8n.';
      if (err && err.message === 'code') msg = 'Zugangscode falsch. Bitte Seite neu laden und den Code erneut eingeben.';
      else if (err && err.name === 'AbortError') msg = 'Keine Antwort nach 90 Sekunden.';
      setError(msg); addLog('Jarvis', msg);
    } finally {
      clearTimeout(to); busy = false;
      if (running) { if (state !== 'off' && !el.dot.classList.contains('err')) setState('idle'); startRec(); }
    }
  }

  function speak(text, audio) {
    return new Promise((resolve) => {
      setState('speaking');
      const done = () => { resolve(); };
      if (audio) {
        player.src = 'data:audio/mpeg;base64,' + audio;
        player.onended = done; player.onerror = () => fallbackSpeak(text, done);
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        player.play().catch(() => fallbackSpeak(text, done));
      } else { fallbackSpeak(text, done); }
    });
  }
  function fallbackSpeak(text, done) {
    if (!('speechSynthesis' in window)) { done(); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = 0.95; u.pitch = 0.8;
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith('de'));
    if (v) u.voice = v;
    u.onend = done; u.onerror = done; speechSynthesis.speak(u);
  }

  /* Bedienung */
  el.start.addEventListener('click', async () => {
    const key = el.key.value.trim() || localStorage.getItem('jarvis_key') || '';
    if (key.length < 6) { el.gateErr.textContent = 'Bitte den Zugangscode eingeben.'; return; }
    localStorage.setItem('jarvis_key', key);
    el.gateErr.textContent = '';
    initAudio(); await initMic();
    if (!setupRec()) { el.gate.classList.add('hidden'); return; }
    running = true; el.gate.classList.add('hidden');
    [el.talk, el.textIn, el.send, el.stop].forEach((b) => (b.disabled = false));
    setState('idle'); startRec();
  });
  el.key.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.start.click(); });
  el.forget.addEventListener('click', () => { localStorage.removeItem('jarvis_key'); el.key.value = ''; el.gateErr.textContent = 'Code gelöscht.'; });
  if (localStorage.getItem('jarvis_key')) el.key.value = localStorage.getItem('jarvis_key');

  function pushDown() { if (!running || busy) return; pushed = true; awaitingUntil = Date.now() + 9000; setState('listening'); }
  el.talk.addEventListener('mousedown', pushDown);
  el.talk.addEventListener('touchstart', (e) => { e.preventDefault(); pushDown(); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && running && document.activeElement && document.activeElement.tagName !== 'INPUT' && !e.repeat) { e.preventDefault(); pushDown(); }
  });
  el.textForm.addEventListener('submit', (e) => {
    e.preventDefault(); const v = el.textIn.value.trim(); if (!v) return;
    el.textIn.value = ''; ask(v);
  });
  el.stop.addEventListener('click', () => {
    running = false; stopRec(); player.pause(); if ('speechSynthesis' in window) speechSynthesis.cancel();
    busy = false; pushed = false; awaitingUntil = 0; setState('off');
    el.start.textContent = 'Jarvis starten'; el.gate.classList.remove('hidden');
    [el.talk, el.textIn, el.send, el.stop].forEach((b) => (b.disabled = true));
  });
})();
</script>
</body>
</html>
