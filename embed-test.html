<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Termivox Embed-Test</title>
<style>
  body{font-family:sans-serif;background:#15130F;color:#F3EEE2;padding:40px;}
  h1{color:#E2BD6C;}
  .row{display:flex;gap:16px;margin:24px 0;flex-wrap:wrap;}
  button{padding:12px 20px;font-size:1rem;border-radius:6px;border:1px solid #8A6C2C;background:#1C1912;color:#F3EEE2;cursor:pointer;}
  button.active{background:#C99A3C;color:#15130F;font-weight:bold;}
  #status{margin-top:16px;padding:12px;background:#1C1912;border-radius:6px;font-family:monospace;font-size:0.85rem;white-space:pre-wrap;}
</style>
</head>
<body>
<h1>Termivox Embed-Test</h1>
<p>Wähle einen Tarif, öffne unten rechts den Chat, schreib etwas wie "Wie sind eure Öffnungszeiten?" und schau, ob eine sinnvolle Antwort kommt.</p>

<div class="row">
  <button onclick="load('standard')" id="btn-standard">Standard (test_salon)</button>
  <button onclick="load('pro')" id="btn-pro">Pro (test_salon)</button>
  <button onclick="load('business')" id="btn-business">Business (test_salon_2, hauptstandort)</button>
  <button onclick="load('business-nord')" id="btn-business-nord">Business (test_salon_2, standort_nord)</button>
</div>

<div id="status">Noch kein Tarif geladen.</div>

<script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  const configs = {
    standard: {
      webhookUrl: 'https://n8n.termivox.com/webhook/d2679026-1274-47af-9ee2-10f952bc1d3d/chat',
      metadata: { salon_id: 'test_salon' }
    },
    pro: {
      webhookUrl: 'https://n8n.termivox.com/webhook/d3698176-82a4-410a-9ea8-c259164e1cff/chat',
      metadata: { salon_id: 'test_salon' }
    },
    business: {
      webhookUrl: 'https://n8n.termivox.com/webhook/620ec96c-99a7-4055-af2c-12281124cce9/chat',
      metadata: { salon_id: 'test_salon_2', standort_id: 'hauptstandort' }
    },
    'business-nord': {
      webhookUrl: 'https://n8n.termivox.com/webhook/620ec96c-99a7-4055-af2c-12281124cce9/chat',
      metadata: { salon_id: 'test_salon_2', standort_id: 'standort_nord' }
    }
  };

  let currentChatEl = null;

  window.load = function(key) {
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + key).classList.add('active');

    // Alten Chat-Container entfernen, falls vorhanden
    document.querySelectorAll('#n8n-chat').forEach(el => el.remove());
    const container = document.createElement('div');
    container.id = 'n8n-chat';
    document.body.appendChild(container);

    const cfg = configs[key];
    document.getElementById('status').textContent =
      'Geladen: ' + key + '\nWebhook: ' + cfg.webhookUrl + '\nMetadata: ' + JSON.stringify(cfg.metadata) +
      '\n\nÖffne jetzt unten rechts das Chat-Symbol.';

    createChat({
      webhookUrl: cfg.webhookUrl,
      metadata: cfg.metadata,
      target: '#n8n-chat',
      initialMessages: ['Hallo! Womit kann ich helfen?']
    });
  };
</script>
</body>
</html>
